<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iFixandRepair – Case Checklist</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f1728,#1a2744);min-height:100vh;color:#e8ecf4;}
    .header{background:linear-gradient(90deg,#2563eb,#1e40af);padding:16px 20px;border-bottom:2px solid #3b82f6;}
    .header h1{font-size:20px;font-weight:800;color:#fff;}
    .header p{font-size:12px;color:#93c5fd;margin-top:2px;}
    .body{padding:16px 16px 120px;}
    .row{display:flex;gap:10px;margin-bottom:14px;}
    select,input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:14px;outline:none;-webkit-appearance:none;}
    select.model-select{width:100%;padding:12px 14px;border:2px solid #3b82f6;font-size:15px;font-weight:600;margin-bottom:14px;border-radius:10px;background:#1e293b;color:#e2e8f0;outline:none;-webkit-appearance:none;}
    input.custom-input{border:2px solid #f59e0b;color:#fbbf24;font-weight:600;padding:12px 14px;margin-bottom:14px;border-radius:10px;background:#1e293b;outline:none;}
    .checkbox-card{background:#1e293b;border-radius:14px;border:1px solid #334155;padding:12px;margin-bottom:14px;}
    .checkbox-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
    .checkbox-card .model-label{font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
    .select-all-btn{padding:4px 12px;border-radius:6px;border:1px solid #475569;background:transparent;color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .case-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;background:#0f172a;border:1.5px solid #1e293b;cursor:pointer;user-select:none;transition:all .12s;}
    .case-item.checked{background:#1e3a5f;border-color:#3b82f6;}
    .cb-box{width:22px;height:22px;border-radius:5px;border:2px solid #475569;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;}
    .cb-box.checked{border-color:#3b82f6;background:#2563eb;}
    .cb-label{font-size:12px;color:#94a3b8;line-height:1.2;}
    .cb-label.checked{color:#93c5fd;font-weight:600;}
    .add-btn{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:none;background:#334155;color:#64748b;font-size:15px;font-weight:700;cursor:default;}
    .add-btn.active{background:linear-gradient(90deg,#2563eb,#1d4ed8);color:#fff;cursor:pointer;}
    .section-title{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
    .entry-card{background:#1e293b;border-radius:10px;border:1px solid #334155;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:flex-start;}
    .entry-model{font-size:14px;font-weight:700;color:#e2e8f0;}
    .entry-cases{font-size:11px;color:#64748b;margin-top:3px;line-height:1.4;}
    .remove-btn{background:#991b1b;border:none;color:#fca5a5;font-size:13px;cursor:pointer;padding:2px 8px;border-radius:6px;font-weight:700;margin-left:8px;flex-shrink:0;}
    .done-box{background:linear-gradient(135deg,#0c4a1e,#14532d);border-radius:14px;border:2px solid #22c55e;padding:18px;margin-top:16px;text-align:center;}
    .done-box h3{font-size:15px;color:#86efac;font-weight:700;margin-bottom:4px;}
    .done-box p{font-size:12px;color:#4ade80;margin-bottom:14px;}
    .export-btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(90deg,#16a34a,#15803d);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 15px rgba(22,163,74,.3);display:flex;align-items:center;justify-content:center;gap:10px;}
    .export-btn:active{opacity:.85;}
    .empty{text-align:center;padding:50px 20px;color:#475569;}
    .empty .icon{font-size:44px;margin-bottom:12px;}
    .empty h3{font-size:15px;font-weight:600;color:#64748b;}
    .empty p{font-size:12px;margin-top:6px;}
    .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;white-space:nowrap;}
    .custom-row{display:flex;gap:8px;margin-bottom:14px;}
    .custom-toggle{padding:10px 13px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
    .custom-toggle.active{background:#f59e0b22;border-color:#f59e0b;color:#fbbf24;}
  </style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
  <h1>iFixandRepair</h1>
  <p>Case Types Checklist</p>
</div>

<div class="body">
  <!-- Store + Employee -->
  <div class="row">
    <select id="store">
      <option value="">Store...</option>
      <option>Diberville</option>
      <option>Rangeline</option>
      <option>Pascagoula</option>
      <option>Ocean Springs</option>
      <option>Montclair</option>
    </select>
    <input type="text" id="employee" placeholder="Your name"/>
  </div>

  <!-- Model picker -->
  <div class="custom-row">
    <select class="model-select" id="modelSelect" style="margin-bottom:0;flex:1;">
      <option value="">— Select Phone Model —</option>
    </select>
    <button class="custom-toggle" id="customToggle" onclick="toggleCustom()">+ Custom</button>
  </div>
  <input type="text" class="custom-input" id="customInput" placeholder="Type custom model (e.g. Samsung A35)" style="display:none;width:100%;"/>

  <!-- Checkboxes -->
  <div class="checkbox-card" id="checkboxArea" style="display:none;">
    <div class="top">
      <span class="model-label" id="checkboxLabel"></span>
      <button class="select-all-btn" onclick="selectAll()">Check All</button>
    </div>
    <div class="grid" id="checkboxGrid"></div>
    <button class="add-btn" id="addBtn" onclick="addEntry()">+ Add</button>
  </div>

  <!-- Entries -->
  <div id="entrySection" style="display:none;">
    <div class="section-title" id="entryTitle">Order List</div>
    <div id="entryList"></div>
    <div class="done-box">
      <h3>Order complete?</h3>
      <p>Export as PDF — saves directly to your phone</p>
      <button class="export-btn" onclick="exportPDF()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
        Export PDF
      </button>
    </div>
  </div>

  <!-- Empty -->
  <div class="empty" id="emptyState">
    <div class="icon">📋</div>
    <h3>Select a phone model to start</h3>
    <p>Check case types needed, add to list</p>
    <p style="margin-top:4px;color:#475569;font-size:11px;">Tap "+ Custom" if your model isn't listed</p>
  </div>
</div>

<script>
const PHONE_MODELS = [
  "iPhone SE","iPhone 7/8","iPhone X/XS/XR",
  "iPhone 11","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max",
  "iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max",
  "iPhone 14","iPhone 14 Pro","iPhone 14 Pro Max",
  "iPhone 15","iPhone 15 Plus","iPhone 15 Pro","iPhone 15 Pro Max",
  "iPhone 16","iPhone 16 Plus","iPhone 16 Pro","iPhone 16 Pro Max","iPhone 16e",
  "iPhone 17","iPhone 17 Pro Max",
  "Samsung A13","Samsung A14","Samsung A16","Samsung A17",
  "Samsung A25","Samsung A26","Samsung A32","Samsung A51","Samsung A54","Samsung A56",
  "Samsung S21","Samsung S22","Samsung S22 Plus","Samsung S22 Ultra",
  "Samsung S23","Samsung S23 Plus","Samsung S23 Ultra",
  "Samsung S24","Samsung S24 FE","Samsung S24 Ultra",
  "Samsung S25","Samsung S25 FE","Samsung S25 Plus","Samsung S25 Ultra",
  "Samsung S26","Samsung S26 Plus","Samsung S26 Ultra",
  "Samsung Fold 4","Samsung Fold 6","Samsung Fold 7",
  "Samsung Flip 3","Samsung Flip 7 SE",
  "Moto G 5G 2025","Moto G 5G 2026","Moto G Stylus 2025",
  "Moto G Power 2025","Moto Edge 2025","Moto Razr 2024","Moto Razr+ 2024","Moto 2026 (All)",
  "Pixel 9A","Pixel 10","Pixel 10 Pro","Pixel 10 Pro XL",
  "iPad 7/8/9","iPad 10th Gen","iPad 12.9"
];

const CASE_TYPES = [
  "Otter/Rugged","OtterBox Camo","OtterBox Flag",
  "Wallet/Flip","Mag Leather Flip","Men Wallet",
  "Butterfly","Diamond/Bling","Diamond MagSafe",
  "MagSafe Ring","MagSafe Stand","Hard Hidden Ring",
  "Shutter","Waterproof","Defender w/ Clip",
  "Glitter MagSafe","Floating Glitter","Ice Crystal",
  "Hard Handle","Puffed Case","Cat Ear & Tail","Eagle Glasses"
];

let entries = [];
let checks = {};
let customMode = false;

// Populate model dropdown
const sel = document.getElementById('modelSelect');
PHONE_MODELS.forEach(m => {
  const o = document.createElement('option');
  o.value = m; o.textContent = m;
  sel.appendChild(o);
});

// Build checkbox grid
const grid = document.getElementById('checkboxGrid');
CASE_TYPES.forEach((ct, i) => {
  const div = document.createElement('div');
  div.className = 'case-item';
  div.id = 'item_'+i;
  div.innerHTML = `<div class="cb-box" id="cb_${i}"></div><span class="cb-label" id="lbl_${i}">${ct}</span>`;
  div.onclick = () => toggleCheck(i);
  grid.appendChild(div);
});

function toggleCustom() {
  customMode = !customMode;
  const btn = document.getElementById('customToggle');
  const inp = document.getElementById('customInput');
  const msel = document.getElementById('modelSelect');
  if (customMode) {
    btn.classList.add('active'); btn.textContent = '← List';
    inp.style.display = 'block'; msel.style.display = 'none';
    inp.focus();
  } else {
    btn.classList.remove('active'); btn.textContent = '+ Custom';
    inp.style.display = 'none'; msel.style.display = 'block';
    inp.value = '';
  }
  updateCheckboxArea();
}

function getActiveModel() {
  if (customMode) return document.getElementById('customInput').value.trim();
  return document.getElementById('modelSelect').value;
}

sel.addEventListener('change', updateCheckboxArea);
document.getElementById('customInput').addEventListener('input', updateCheckboxArea);

function updateCheckboxArea() {
  const m = getActiveModel();
  const area = document.getElementById('checkboxArea');
  if (m) {
    area.style.display = 'block';
    document.getElementById('checkboxLabel').textContent = m;
    document.getElementById('emptyState').style.display = 'none';
  } else {
    area.style.display = 'none';
    if (entries.length === 0) document.getElementById('emptyState').style.display = 'block';
  }
  updateAddBtn();
}

function toggleCheck(i) {
  checks[i] = !checks[i];
  const item = document.getElementById('item_'+i);
  const box  = document.getElementById('cb_'+i);
  const lbl  = document.getElementById('lbl_'+i);
  if (checks[i]) {
    item.classList.add('checked'); box.classList.add('checked'); lbl.classList.add('checked');
    box.innerHTML = `<svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  } else {
    item.classList.remove('checked'); box.classList.remove('checked'); lbl.classList.remove('checked');
    box.innerHTML = '';
  }
  updateAddBtn();
}

function selectAll() {
  const allOn = CASE_TYPES.every((_, i) => checks[i]);
  CASE_TYPES.forEach((_, i) => {
    checks[i] = !allOn;
    const item = document.getElementById('item_'+i);
    const box  = document.getElementById('cb_'+i);
    const lbl  = document.getElementById('lbl_'+i);
    if (!allOn) {
      item.classList.add('checked'); box.classList.add('checked'); lbl.classList.add('checked');
      box.innerHTML = `<svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 6L5 9L10 3" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    } else {
      item.classList.remove('checked'); box.classList.remove('checked'); lbl.classList.remove('checked');
      box.innerHTML = '';
    }
  });
  const btn = document.querySelector('.select-all-btn');
  btn.textContent = allOn ? 'Check All' : 'Uncheck All';
  updateAddBtn();
}

function updateAddBtn() {
  const count = CASE_TYPES.filter((_, i) => checks[i]).length;
  const m = getActiveModel();
  const btn = document.getElementById('addBtn');
  if (count > 0 && m) {
    btn.className = 'add-btn active';
    btn.textContent = `+ Add ${m} (${count} case${count!==1?'s':''})`;
  } else {
    btn.className = 'add-btn';
    btn.textContent = '+ Add (select cases above)';
  }
}

function addEntry() {
  const m = getActiveModel();
  const cases = CASE_TYPES.filter((_, i) => checks[i]);
  if (!m || cases.length === 0) return;
  entries.push({ model: m, cases });
  // Reset
  checks = {};
  CASE_TYPES.forEach((_, i) => {
    const item = document.getElementById('item_'+i);
    const box  = document.getElementById('cb_'+i);
    const lbl  = document.getElementById('lbl_'+i);
    item.classList.remove('checked'); box.classList.remove('checked'); lbl.classList.remove('checked');
    box.innerHTML = '';
  });
  if (!customMode) { document.getElementById('modelSelect').value = ''; }
  else { document.getElementById('customInput').value = ''; }
  document.getElementById('checkboxArea').style.display = 'none';
  renderEntries();
  flash(`✓ ${m} added`);
  updateAddBtn();
}

function removeEntry(i) {
  entries.splice(i, 1);
  renderEntries();
}

function renderEntries() {
  const list = document.getElementById('entryList');
  const sec  = document.getElementById('entrySection');
  const emp  = document.getElementById('emptyState');
  list.innerHTML = '';
  if (entries.length === 0) {
    sec.style.display = 'none';
    emp.style.display = 'block';
    return;
  }
  sec.style.display = 'block';
  emp.style.display = 'none';
  document.getElementById('entryTitle').textContent = `Order List — ${entries.length} model${entries.length!==1?'s':''}`;
  entries.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'entry-card';
    div.innerHTML = `
      <div style="flex:1">
        <div class="entry-model">${i+1}. ${e.model}</div>
        <div class="entry-cases">${e.cases.join(', ')}</div>
      </div>
      <button class="remove-btn" onclick="removeEntry(${i})">✕</button>`;
    list.appendChild(div);
  });
}

function flash(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const store = document.getElementById('store').value || '___';
  const emp   = document.getElementById('employee').value || '___';
  const date  = new Date().toLocaleDateString();
  const lm = 40, rm = 555, pw = rm - lm;
  let y = 0;

  // Header
  doc.setFillColor(37, 99, 235);
  doc.rect(0, 0, 595, 52, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(20); doc.setFont('helvetica','bold');
  doc.text('iFixandRepair', lm, 28);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text('Accessories Order', lm, 43);
  doc.setFontSize(10);
  doc.text(date, rm, 28, { align: 'right' });
  y = 65;

  // Meta
  doc.setFillColor(241,245,249);
  doc.rect(lm, y, pw, 24, 'F');
  doc.setTextColor(30,41,59);
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text(`Store: ${store}`, lm+6, y+15);
  doc.text(`Employee: ${emp}`, lm+165, y+15);
  doc.text(`Date: ${date}`, lm+370, y+15);
  y += 34;

  // Table header
  doc.setFillColor(37,99,235);
  doc.rect(lm, y, pw, 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('Phone Model', lm+6, y+14);
  doc.text('Case Types Needed', lm+158, y+14);
  y += 22;

  // Rows
  entries.forEach((entry, idx) => {
    const caseText = entry.cases.join(', ');
    const lines = doc.splitTextToSize(caseText, pw - 162);
    const rowH = Math.max(26, lines.length * 13 + 10);

    if (y + rowH > 800) {
      doc.addPage();
      y = 40;
    }

    // Alt row bg
    doc.setFillColor(idx % 2 === 0 ? 255 : 248, idx % 2 === 0 ? 255 : 250, idx % 2 === 0 ? 255 : 252);
    doc.rect(lm, y, pw, rowH, 'F');

    // Model
    doc.setTextColor(30,58,138);
    doc.setFontSize(10); doc.setFont('helvetica','bold');
    doc.text(`${idx+1}. ${entry.model}`, lm+6, y+16);

    // Cases
    doc.setTextColor(51,65,85);
    doc.setFontSize(9); doc.setFont('helvetica','normal');
    doc.text(lines, lm+158, y+16, { lineHeightFactor: 1.4 });

    // Row border
    doc.setDrawColor(226,232,240);
    doc.setLineWidth(0.5);
    doc.rect(lm, y, pw, rowH, 'S');

    y += rowH;
  });

  // Totals
  y += 6;
  const totalCases = entries.reduce((a,e) => a+e.cases.length, 0);
  doc.setFillColor(239,246,255);
  doc.rect(lm, y, pw, 24, 'F');
  doc.setDrawColor(191,219,254);
  doc.rect(lm, y, pw, 24, 'S');
  doc.setTextColor(29,78,216);
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text(`Total: ${entries.length} model(s)  |  ${totalCases} case type(s) needed`, lm+8, y+15);
  y += 34;

  // Footer
  doc.setTextColor(148,163,184);
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(`iFixandRepair — Accessories Order — Generated ${date}`, lm, y);

  // Save — triggers real download on any browser
  const filename = `${store.replace(/\s/g,'_')}_Accessories_Order_${date.replace(/\//g,'-')}.pdf`;
  doc.save(filename);
  flash('✓ PDF downloaded!');
}
</script>
</body>
</html>
